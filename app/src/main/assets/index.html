<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="keyScreen">
  <div id="keyTitle">Cole sua API key do Gemini</div>
  <input id="keyInput" placeholder="AIza...">
  <button id="keySave">Salvar e continuar</button>
  <div id="keyHint">Gere em aistudio.google.com/apikey</div>
</div>

<div id="chatScreen" class="hidden">
  <div id="topbar">
    <span class="icon" id="menuIcon"><img class="iconSvg" src="icons/menu.svg"></span>
    <span id="modelName">Gemini Go <span class="chev"><img class="chevSvg" src="icons/chevron_right.svg"></span></span>
    <span class="icon" id="accountIcon"><img class="iconSvg" src="icons/edit.svg"></span>
    <span class="icon" id="moreIcon"><img class="iconSvg" src="icons/more_vert.svg"></span>
  </div>

  <div id="greeting"><img id="sparkleIcon" src="icons/sparkle.svg"> Oi, o que você tem em mente?</div>
  <div id="chat"></div>
  <div id="disclaimer">O Gemini Go é uma IA e pode cometer erros.</div>

  <div id="inputPill">
    <span id="attach" class="pillIcon"><img class="iconSvg" src="icons/plus.svg"></span>
    <input id="msg" placeholder="Peça ao Gemini Go...">
    <span class="pillIcon mic"><img class="iconSvg" src="icons/mic.svg"></span>
    <span id="send" class="sendBtn"><img class="iconSvgSend" src="icons/send.svg"></span>
  </div>
</div>

<div id="sheetOverlay" class="hidden"></div>
<div id="attachSheet" class="hidden">
  <div id="sheetHandle"></div>
  <div id="sheetGrid">
    <label class="sheetItem">
      <input type="file" id="fileInput" accept="image/*,application/pdf,text/plain" class="hidden">
      <span class="sheetIcon">📎</span>
      <span>Arquivos</span>
    </label>
    <div class="sheetItem" id="sheetCamera">
      <span class="sheetIcon"><img class="iconSvg" src="icons/camera.svg"></span>
      <span>Câmera</span>
    </div>
  </div>
</div>

<div id="navOverlay" class="hidden"></div>
<div id="navDrawer" class="hidden">
  <div class="navItem" id="navNewChat"><img class="iconSvg" src="icons/add.svg"><span>Nova conversa</span></div>
  <div class="navItem" id="navGems"><img class="iconSvg" src="icons/gems.svg"><span>Gems</span></div>
  <div class="navItem" id="navSettings"><img class="iconSvg" src="icons/settings.svg"><span>Configurações</span></div>
  <div class="navItem" id="navHelp"><img class="iconSvg" src="icons/help.svg"><span>Ajuda</span></div>
</div>

<div id="accountSheet" class="hidden">
  <div id="accountAvatar">🔑</div>
  <div id="accountLabel">API key ativa</div>
  <input id="accountKeyInput" placeholder="Colar nova API key">
  <button id="accountKeySave">Trocar chave</button>
</div>

<script src="app.js"></script>
</body>
</html>
